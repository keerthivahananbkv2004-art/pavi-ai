<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pavi AI</title>

<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  margin: 0;
  background: linear-gradient(135deg, #f5f5f5, #e8f5e9);
  color: #333;
}

header {
  background: linear-gradient(90deg, #43a047, #66bb6a);
  color: white;
  padding: 20px;
  text-align: center;
  font-size: 1.5em;
  font-weight: bold;
}

#chat {
  padding: 20px;
  height: 68vh;
  overflow-y: auto;
}

.msg {
  padding: 12px 18px;
  margin: 10px;
  border-radius: 18px;
  max-width: 75%;
  font-size: 0.95em;
  line-height: 1.5;
  word-wrap: break-word;
  white-space: pre-wrap;
}

.user {
  background: #d1e7dd;
  margin-left: auto;
}

.bot {
  background: #ffffff;
}

#quick {
  text-align: center;
  padding: 8px;
}

#quick button {
  margin: 4px;
  padding: 8px 12px;
  border-radius: 20px;
  border: none;
  background: #e0f2f1;
  cursor: pointer;
}

#controls {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #ffffff;
  box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
  box-sizing: border-box;
}

select, input {
  padding: 12px;
  border: 1px solid #cfd8dc;
  border-radius: 8px;
  font-size: 1em;
  outline: none;
}

input {
  flex: 1;
}

button.send {
  padding: 12px 20px;
  background: linear-gradient(90deg, #4CAF50, #66bb6a);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 1em;
  cursor: pointer;
}

.typing span {
  animation: blink 1.2s infinite;
}

.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
  0% { opacity: 0.2; }
  20% { opacity: 1; }
  100% { opacity: 0.2; }
}
</style>
</head>

<body>

<header>🌿 Pavi AI</header>

<div id="chat"></div>

<div id="quick">
  <button onclick="quick('Explain photosynthesis')">Explain</button>
  <button onclick="quick('Quiz me fast on genetics')">Quiz</button>
  <button onclick="quick('Summarize this topic')">Summary</button>
  <button onclick="quick('Check my answers: A B C')">Check</button>
</div>

<div id="controls">
  <select id="mode">
    <option value="chat">Chat</option>
    <option value="explain">Explain</option>
    <option value="summary">Summary</option>
    <option value="quiz">Quiz</option>
    <option value="check">Check</option>
  </select>

  <input id="msg" placeholder="Ask anything..." />
  <button class="send" onclick="send()">Send</button>
</div>

<script>
const API = "https://sincere-urgent-shuffle.ngrok-free.dev/ask";

function add(text, type) {
  const d = document.createElement("div");
  d.className = "msg " + type;
  d.innerHTML = text.replace(/\n/g, "<br>");
  document.getElementById("chat").appendChild(d);
  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
  return d;
}

function quick(text) {
  document.getElementById("msg").value = text;
  send();
}

async function send() {
  const input = document.getElementById("msg");
  const mode = document.getElementById("mode").value;
  const message = input.value.trim();
  if (!message) return;

  add(message, "user");
  input.value = "";

  const t = add("Thinking <span class='typing'><span>.</span><span>.</span><span>.</span></span>", "bot");

  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, mode })
    });

    const raw = await r.text();

    let data;
    try {
      data = JSON.parse(raw);
    } catch (e) {
      t.innerText = "⚠️ Invalid response from server";
      console.error("Raw response:", raw);
      return;
    }

    if (r.ok && data.response) {
      t.innerHTML = data.response.replace(/\n/g, "<br>");
    } else {
      t.innerText = "⚠️ Server error";
      console.error("HTTP status:", r.status, "Raw:", raw);
    }
  } catch (err) {
    console.error(err);
    t.innerText = "⚠️ Network error (check backend / ngrok)";
  }
}

document.getElementById("msg").addEventListener("keypress", e => {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
