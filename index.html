<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pavi AI</title>

<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  margin: 0;
  background: linear-gradient(135deg, #f5f5f5, #e8f5e9);
  color: #333;
}

header {
  background: linear-gradient(90deg, #43a047, #66bb6a);
  color: white;
  padding: 20px;
  text-align: center;
  font-size: 1.5em;
  font-weight: bold;
}

#chat {
  padding: 20px;
  height: 68vh;
  overflow-y: auto;
}

.msg {
  padding: 12px 18px;
  margin: 10px;
  border-radius: 18px;
  max-width: 75%;
  font-size: 0.95em;
  line-height: 1.5;
  word-wrap: break-word;
}

.user {
  background: #d1e7dd;
  margin-left: auto;
}

.bot {
  background: #ffffff;
}

#quick {
  text-align: center;
  padding: 8px;
}

#quick button {
  margin: 4px;
  padding: 8px 12px;
  border-radius: 20px;
  border: none;
  background: #e0f2f1;
  cursor: pointer;
}

#controls {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  padding: 12px;
  background: #ffffff;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button.send {
  padding: 12px 20px;
  margin-left: 10px;
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 8px;
}

.typing span {
  animation: blink 1.2s infinite;
}
.typing span:nth-child(2){animation-delay:0.2s;}
.typing span:nth-child(3){animation-delay:0.4s;}

@keyframes blink {
  0% {opacity:0.2;}
  20% {opacity:1;}
  100% {opacity:0.2;}
}
</style>
</head>

<body>

<header>🌿 Pavi AI</header>

<div id="chat"></div>

<div id="quick">
  <button onclick="quick('Explain photosynthesis')">Explain</button>
  <button onclick="quick('Quiz me fast')">Quiz</button>
  <button onclick="quick('Summarize this topic')">Summary</button>
</div>

<div id="controls">
  <input id="msg" placeholder="Ask anything..." />
  <button class="send" onclick="send()">Send</button>
</div>

<script>

// 🔥 IMPORTANT — UPDATE WHEN NGROK CHANGES
const API = "https://sincere-urgent-shuffle.ngrok-free.dev/ask";

function add(text,type){
 let d=document.createElement("div");
 d.className="msg "+type;
 d.innerHTML = text.replace(/\n/g,"<br>");
 document.getElementById("chat").appendChild(d);
 document.getElementById("chat").scrollTop=999999;
 return d;
}

function quick(text){
 document.getElementById("msg").value=text;
 send();
}

async function send(){
 let input = document.getElementById("msg");
 let m = input.value.trim();
 if(!m) return;

 add(m,"user");
 input.value="";

 let t = add("Thinking <span class='typing'><span>.</span><span>.</span><span>.</span></span>","bot");

 try {
   const r = await fetch(API, {
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body: JSON.stringify({message:m})
   });

   console.log("HTTP Status:", r.status);

   const raw = await r.text();
   console.log("RAW Response:", raw);

   let data;
   try {
     data = JSON.parse(raw);
   } catch {
     t.innerText = "⚠️ Invalid response from server";
     return;
   }

   if(r.ok && data.response){
     t.innerHTML = data.response.replace(/\n/g,"<br>");
   } else {
     t.innerText = "⚠️ Server error (" + r.status + ")";
   }

 } catch(err){
   console.error("Fetch Error:", err);
   t.innerText = "⚠️ Network error (check backend / ngrok)";
 }
}

// ENTER KEY SUPPORT
document.getElementById("msg").addEventListener("keypress", e=>{
 if(e.key==="Enter") send();
});

</script>

</body>
</html>
